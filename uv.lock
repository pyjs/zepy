    { name = "pyjs", git = "https://github.com/pyjs/pyjs.git?rev=5e57032b0ed5dec25b48981a416bf6f5d5b192d2" },
    { name = "pytest", marker = "extra == 'test'", specifier = ">=9.0" },
    { name = "ruff", marker = "extra == 'test'", specifier = ">=0.15.0" },
]
provides-extras = ["test"]

[package.metadata.requires-dev]
release = [
    { name = "build", specifier = ">=1.3" },
    { name = "twine", specifier = ">=6.2" },
    { name = "wheel-stub", specifier = "==0.5.0" },
]
