[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zepy"
version = "0.1.0"
description = "A Python IDE built with PyJS and Electron."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["pyjs"]

[project.urls]
Homepage = "https://github.com/pyjs/zepy"
Repository = "https://github.com/pyjs/zepy"
Issues = "https://github.com/pyjs/zepy/issues"

[project.scripts]
zepy = "zepy.__main__:main"

[project.optional-dependencies]
test = ["pytest>=9.0", "ruff>=0.15.0"]

[tool.setuptools.packages.find]
include = ["zepy", "zepy.*"]

[tool.pyjs]
application = "zepy.app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pyjs_browser = "managed"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["external", "dist"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.uv.sources]
pyjs = { git = "https://github.com/pyjs/pyjs.git", rev = "5e57032b0ed5dec25b48981a416bf6f5d5b192d2" }

[dependency-groups]
release = ["wheel-stub==0.5.0", "build>=1.3", "twine>=6.2"]
